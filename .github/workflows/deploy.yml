name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le site est servi sous https://<compte>.github.io/Kaomoji/ : il faut le base-href
      - run: npx ng build --base-href /Kaomoji/

      # Fallback pour d'éventuelles routes Angular (GitHub Pages renvoie 404.html sinon)
      - run: cp dist/kaomoji/browser/index.html dist/kaomoji/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/kaomoji/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
